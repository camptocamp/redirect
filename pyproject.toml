[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = []
ignore = ["ANN401", "COM812", "D100", "D104", "D105", "D107", "D200", "D202", "D207", "D208", "D212", "E501", "EM101", "EM102", "ERA001", "FA", "FBT001", "FBT002", "FIX002", "I001", "PERF203", "Q000", "S101", "SIM105", "T201", "TD002", "W293"]
extend-select = ["UP", "I", "S", "B", "ALL"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["ANN", "ARG", "ASYNC", "BLE001", "D", "DTZ", "E722", "FBT003", "INP001", "N", "PGH003", "PLC", "PLR2004", "PLW0603", "PLW1641", "RET", "RUF012", "RUF100", "S104", "S105", "S106", "S108", "S113", "S324", "S603", "S607", "S608", "SLF", "TRY003", "TRY301"]
"**/tests/**" = ["ANN", "ARG", "ASYNC", "BLE001", "D", "DTZ", "E722", "FBT003", "INP001", "N", "PGH003", "PLC", "PLR2004", "PLW0603", "PLW1641", "RET", "RUF012", "RUF100", "S104", "S105", "S106", "S108", "S113", "S324", "S603", "S607", "S608", "SLF", "TRY003", "TRY301"]
"**/test_*.py" = ["ANN", "ARG", "ASYNC", "BLE001", "D", "DTZ", "E722", "FBT003", "INP001", "N", "PGH003", "PLC", "PLR2004", "PLW0603", "PLW1641", "RET", "RUF012", "RUF100", "S104", "S105", "S106", "S108", "S113", "S324", "S603", "S607", "S608", "SLF", "TRY003", "TRY301"]
"**/*_test.py" = ["ANN", "ARG", "ASYNC", "BLE001", "D", "DTZ", "E722", "FBT003", "INP001", "N", "PGH003", "PLC", "PLR2004", "PLW0603", "PLW1641", "RET", "RUF012", "RUF100", "S104", "S105", "S106", "S108", "S113", "S324", "S603", "S607", "S608", "SLF", "TRY003", "TRY301"]

[tool.poetry]
version = "0.0.0"

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "0.141.1"
uvicorn = "0.52.0"
c2casgiutils = "0.14.0"
pydantic-settings = "2.14.2"
certifi = "2026.7.22"
html-sanitizer = "2.6.0"
prometheus-client = "0.26.0"
prometheus-fastapi-instrumentator = "8.1.0"
sentry-sdk = "2.66.1"
anyio = "4.14.2"
jinja2 = "3.1.6"

[tool.poetry.group.dev.dependencies]
prospector-profile-duplicated = "1.12.0"
prospector = { version = "1.19.1", extras = ["with_bandit", "with_mypy", "with_ruff", "with_pyroma"] }
pytest = "9.1.1"
pytest-asyncio = "1.4.0"
prospector-profile-utils = "1.27.0"
types-pyyaml = "6.0.12.20260518"
httpx = "0.28.1"
ruff = "0.16.1"
pylint = "4.0.6"

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
pattern = "^(?P<base>\\d+(\\.\\d+)*)"
format-jinja = """
{%- if env.get("VERSION_TYPE") == "default_branch" -%}
{{serialize_pep440(bump_version(base, 1), dev=distance)}}
{%- elif env.get("VERSION_TYPE") == "stabilization_branch" -%}
{{serialize_pep440(bump_version(base, 2), dev=distance)}}
{%- elif distance == 0 -%}
{{serialize_pep440(base)}}
{%- else -%}
{{serialize_pep440(bump_version(base), dev=distance)}}
{%- endif -%}
"""

[tool.poetry-plugin-tweak-dependencies-version]
default = "present"

[tool.pytest.ini_options]
addopts = "--strict-markers --asyncio-mode=auto"
testpaths = [
    "redirect",
    "tests",
]
markers = [
    "docker: Tests that require a running Docker container.",
]

[project]
classifiers = [
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
]
dynamic = ["dependencies", "version"]
name = "redirect"
description = "Not used"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "c2casgiutils", "pydantic-settings", "certifi", "html-sanitizer", "types-pyyaml==6.0.12.20260518", "prometheus-client", "prometheus-fastapi-instrumentator", "sentry-sdk", "anyio", "jinja2"]

[build-system]
requires = ["poetry-core==2.4.0", "poetry-dynamic-versioning[plugin]==1.10.0"]
build-backend = "poetry.core.masonry.api"
